<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LifeOS</title>
<style>
  :root{
    --bg:#04040C; --bg2:#0A0A16; --card:rgba(14,15,26,0.82); --border:rgba(255,255,255,0.09);
    --text:#F2F3F8; --text2:#8A8FA8; --grid:rgba(255,255,255,0.055); --shadow:0 18px 40px rgba(0,0,0,0.55);
    --acc:#3B82F6; --accSoft:#7DA9F8; --accInk:#050508;
  }
  html[data-mode="blanc"]{
    --bg:#F2F3F8; --bg2:#FFFFFF; --card:#FFFFFF; --border:rgba(15,18,40,0.10);
    --text:#0C0E1A; --text2:#5B6072; --grid:rgba(15,18,40,0.07); --shadow:0 14px 34px rgba(20,30,70,0.10);
    --accInk:#0C0E1A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter','SF Pro Display',system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    background-image:radial-gradient(var(--grid) 1px, transparent 1px), linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    background-size:26px 26px, 100% 100%;
  }
  ::selection{background:color-mix(in srgb, var(--acc) 35%, transparent)}
  input,textarea,select{outline:none;font-family:inherit}
  ::placeholder{color:var(--text2);opacity:.7}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:8px 12px;font-weight:600;transition:transform .15s}
  .btn:hover{transform:scale(1.05)}
  .btn-acc{background:linear-gradient(135deg,var(--acc),var(--accSoft));color:var(--accInk);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 40%, transparent)}
  .btn-ghost{background:var(--bg2);border:1px solid var(--border);color:var(--text2)}
  .btn-soft{background:color-mix(in srgb,var(--acc) 14%, transparent);border:1px solid color-mix(in srgb,var(--acc) 30%, transparent);color:var(--accSoft)}
  .fld{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .glow{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc) 60%, transparent))}
  @keyframes pulseGlow{0%,100%{opacity:1}50%{opacity:.55}}
  .pulse{animation:pulseGlow 2.4s ease-in-out infinite}
  @keyframes livePulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}
  .livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accSoft);box-shadow:0 0 8px var(--accSoft);animation:livePulse 1.6s infinite}
  header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 30%, transparent), transparent)}
  .brand h1{font-size:24px;letter-spacing:.02em}
  .brand h1 span{color:var(--acc)}
  .brand p{font-size:11px;color:var(--text2)}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;gap:2px}
  .seg button{border:none;background:none;cursor:pointer;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text2)}
  .seg button.on{background:linear-gradient(135deg,var(--acc),var(--accSoft));color:var(--accInk);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 45%, transparent)}
  .seg.mini button{padding:5px 10px;font-size:11px}
  .dots{display:flex;gap:7px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 10px}
  .dots button{width:19px;height:19px;border-radius:50%;border:1px solid var(--border);cursor:pointer;transition:transform .15s}
  .dots button:hover{transform:scale(1.15)}
  .dots button.on{border:2px solid var(--text);box-shadow:0 0 10px var(--acc)}
  nav.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:18px}
  nav.tabs button{display:flex;align-items:center;gap:7px;border:1px solid transparent;background:none;color:var(--text2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
  nav.tabs button .num{font-size:10px;opacity:.6}
  nav.tabs button.on{background:color-mix(in srgb,var(--acc) 16%, transparent);color:var(--accSoft);border-color:color-mix(in srgb,var(--acc) 35%, transparent);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 22%, transparent)}
  .grid2{display:grid;gap:18px}
  @media(min-width:900px){.grid2{grid-template-columns:2fr 1fr}.grid2b{grid-template-columns:1fr 1fr}}
  .card{padding:20px}
  .card h2{font-size:15px;margin-bottom:2px}
  .card .sub{font-size:11px;color:var(--text2);margin-bottom:14px}
  .cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .navbtns{display:flex;align-items:center;gap:6px}
  .navbtns .lbl{font-size:12px;font-weight:700;min-width:110px;text-align:center}
  .gridscroll{overflow-x:auto;padding-bottom:6px}
  .hrow{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,30px);gap:6px;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:2px}
  .hrow:hover{background:color-mix(in srgb,var(--acc) 5%, transparent)}
  .hrow.m{grid-template-columns:minmax(110px,1fr) repeat(31,20px)}
  .hname{display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden}
  .hname .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hmeta{display:flex;gap:7px;align-items:center;font-size:10px;color:var(--text2);font-family:ui-monospace,monospace}
  .hmeta .st{color:var(--accSoft)}
  .hdel{background:none;border:none;color:var(--text2);font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s}
  .hrow:hover .hdel{opacity:1}
  .dayhead{display:grid;grid-template-columns:minmax(110px,1fr) repeat(7,30px);gap:6px;margin-bottom:8px;text-align:center}
  .dayhead.m{grid-template-columns:minmax(110px,1fr) repeat(31,20px)}
  .dayhead .d{font-size:9px;color:var(--text2);font-family:ui-monospace,monospace;line-height:1.2}
  .dayhead .d.on{color:var(--accSoft);font-weight:700}
  .chk{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--accInk);font-size:14px;cursor:pointer;transition:box-shadow .15s;display:flex;align-items:center;justify-content:center;padding:0}
  .chk.m{width:20px;height:20px;border-radius:5px;font-size:9px}
  .chk.today{border-color:color-mix(in srgb,var(--acc) 45%, transparent)}
  .chk.done{background:linear-gradient(135deg,var(--acc),var(--accSoft));border-color:var(--acc);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 45%, transparent)}
  .chk.fut{opacity:.15;cursor:default}
  .heatwrap{overflow-x:auto;padding:4px 0 6px}
  .heat{display:flex;gap:3px;margin-bottom:10px}
  .hcol{display:flex;flex-direction:column;gap:3px}
  .hcell{width:12px;height:12px;border-radius:3px;border:1px solid var(--border);cursor:pointer;background:var(--bg2);flex-shrink:0}
  .hcell.on{background:linear-gradient(135deg,var(--acc),var(--accSoft));border-color:var(--acc);box-shadow:0 0 6px color-mix(in srgb,var(--acc) 45%, transparent)}
  .hcell.miss{background:color-mix(in srgb,var(--acc) 8%, transparent)}
  .hcell.fut{opacity:.08;cursor:default}
  .hcell.ph{visibility:hidden}
  .heatlab{font-size:9px;color:var(--text2);font-family:ui-monospace,monospace;display:inline-flex;height:12px;align-items:center}
  .legend{display:flex;gap:12px;align-items:center;font-size:10px;color:var(--text2);margin-top:8px;flex-wrap:wrap}
  .legend .sq{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid var(--border);margin-right:4px;vertical-align:middle}
  .legend .sq.on{background:linear-gradient(135deg,var(--acc),var(--accSoft));border-color:var(--acc)}
  .legend .sq.miss{background:color-mix(in srgb,var(--acc) 8%, transparent)}
  .task{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px}
  .task .tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text2);background:none;color:var(--accInk);font-size:11px;cursor:pointer;flex-shrink:0}
  .task .tick.done{background:linear-gradient(135deg,var(--acc),var(--accSoft));border-color:var(--acc);box-shadow:0 0 8px color-mix(in srgb,var(--acc) 45%, transparent)}
  .task .tx{flex:1;font-size:13px}
  .task .tx.done{text-decoration:line-through;color:var(--text2)}
  .task .del{background:none;border:none;color:var(--text2);font-size:11px;cursor:pointer;opacity:0}
  .task:hover .del{opacity:1}
  .kpi{padding:16px}
  .kpi .lb{font-size:11px;color:var(--text2)}
  .kpi .vl{font-size:28px;font-weight:800;color:var(--accSoft);font-family:ui-monospace,monospace;margin-top:2px}
  .kpi .sb{font-size:10px;color:var(--text2)}
  .kpis{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:800px){.kpis{grid-template-columns:repeat(4,1fr)}}
  .dlrow{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .dlrow.urgent{border-color:rgba(245,158,11,0.4)}
  .dlbox{width:46px;height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,monospace;flex-shrink:0}
  .dlbox .n{font-size:15px;font-weight:800;line-height:1}
  .dlbox .u{font-size:8px;text-transform:uppercase}
  .note{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px}
  .note p{font-size:13px;white-space:pre-wrap;word-break:break-word;padding-right:14px;line-height:1.55}
  .note .dt{font-size:9px;color:var(--text2);font-family:ui-monospace,monospace;margin-top:10px}
  .note .del{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--text2);font-size:11px;cursor:pointer;opacity:0}
  .note:hover .del{opacity:1}
  .notegrid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:700px){.notegrid{grid-template-columns:repeat(3,1fr)}}
  .pre{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;max-height:340px;overflow:auto}
  .empty{padding:26px;text-align:center;color:var(--text2);font-size:13px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid color-mix(in srgb,var(--acc) 45%, transparent);border-radius:12px;padding:10px 16px;font-size:13px;box-shadow:0 0 18px color-mix(in srgb,var(--acc) 30%, transparent);z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  .visgrid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:800px){.visgrid{grid-template-columns:repeat(3,1fr)}}
  .vislot{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
  .vislot .prev{height:70px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .vislot .prev img,.vislot .prev svg{max-height:64px;max-width:100%}
  .vislot p{font-size:11px;color:var(--text2);margin-bottom:8px}
  .hero{border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
  .hero img,.hero svg{display:block;width:100%;height:110px;object-fit:cover}
  footer.site{margin-top:26px;text-align:center;font-size:10px;color:var(--text2)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
  .modal.open{display:flex}
  .modal .inner{max-width:640px;width:100%;max-height:88vh;overflow:auto}
  /* ================= FX : animations de fou ================= */
  @keyframes fadeIn{from{opacity:0}}
  .fxaurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
  .fxaurora .blob{position:absolute;width:44vw;height:44vw;left:8%;top:12%;border-radius:50%;filter:blur(80px);opacity:.16;background:var(--acc);animation:blobDrift 26s ease-in-out infinite alternate}
  .fxaurora .b2{left:52%;top:44%;background:#8B5CF6;opacity:.12;animation-duration:33s;animation-delay:-9s}
  .fxaurora .b3{left:26%;top:62%;width:34vw;height:34vw;background:#22D3EE;opacity:.08;animation-duration:41s;animation-delay:-19s}
  @keyframes blobDrift{0%{transform:translate(-6%,-8%) scale(1) rotate(0deg)}50%{transform:translate(9%,7%) scale(1.3) rotate(45deg)}100%{transform:translate(-5%,10%) scale(.85) rotate(-35deg)}}
  html[data-mode="blanc"] .fxaurora .blob{opacity:.10;filter:blur(60px)}
  #fxStars{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .star{position:absolute;border-radius:50%;background:var(--accSoft);opacity:0;animation:starFloat linear infinite}
  @keyframes starFloat{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.85}80%{opacity:.5}100%{transform:translateY(-112vh) scale(.3);opacity:0}}
  header.top,.hero,nav.tabs{animation:fxIn .5s cubic-bezier(.2,.9,.25,1.18) both}
  .panel,.hrow,.task,.dlrow,.note{animation:fxIn .55s cubic-bezier(.2,.9,.25,1.18) both;animation-delay:calc(var(--d,0)*70ms)}
  @keyframes fxIn{from{opacity:0;transform:translateY(26px) scale(.96) rotate(.4deg)}}
  .dlrow.urgent{animation:fxIn .55s cubic-bezier(.2,.9,.25,1.18) both,urgentPulse 1.6s ease-in-out infinite;animation-delay:calc(var(--d,0)*70ms),.6s}
  @keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 20px 2px rgba(245,158,11,.22)}}
  .hero{position:relative}
  .hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);background-size:250% 100%;animation:sheen 3.4s linear infinite}
  @keyframes sheen{from{background-position:180% 0}to{background-position:-120% 0}}
  .brand h1 span{background:linear-gradient(90deg,var(--acc) 0%,var(--accSoft) 30%,#EBD27A 55%,var(--accSoft) 75%,var(--acc) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:titleSlide 3.6s linear infinite}
  @supports not (-webkit-background-clip:text){.brand h1 span{color:var(--acc);-webkit-text-fill-color:var(--acc);background:none}}
  @keyframes titleSlide{from{background-position:200% 0}to{background-position:-120% 0}}
  .brand .logo{animation:logoFloat 5.5s ease-in-out infinite,pulseGlow 2.4s ease-in-out infinite}
  @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
  .btn{position:relative;overflow:hidden}
  .btn::after{content:"";position:absolute;top:0;left:-90%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-22deg)}
  .btn:hover::after{animation:shineSweep .55s ease}
  @keyframes shineSweep{to{left:140%}}
  .btn:hover{transform:translateY(-2px) scale(1.06)}
  .btn:active{transform:scale(.93)}
  [data-act]{position:relative;overflow:hidden}
  .seg button,nav.tabs button{transition:transform .18s,color .18s,background .18s,box-shadow .18s}
  .seg button:hover,nav.tabs button:hover{transform:translateY(-2px) scale(1.05)}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(2.4);opacity:0}}
  .chk{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .15s}
  .chk:not(:disabled):not(.fut):hover{transform:scale(1.25) rotate(-8deg);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 60%, transparent)}
  .chk:not(:disabled):active{transform:scale(.8)}
  .chk.today{animation:chkToday 2s ease-in-out infinite}
  @keyframes chkToday{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 25%, transparent)}50%{box-shadow:0 0 16px 2px color-mix(in srgb,var(--acc) 65%, transparent)}}
  .chk.fx-pop,.tick.fx-pop,.hcell.fx-pop{animation:chkPop .55s cubic-bezier(.2,2.2,.4,1)}
  @keyframes chkPop{0%{transform:scale(.3) rotate(-30deg)}55%{transform:scale(1.45) rotate(10deg)}100%{transform:scale(1)}}
  .hcell{animation:heatIn .35s both;animation-delay:min(calc(var(--c,0)*6ms),650ms);transition:transform .12s,box-shadow .12s}
  @keyframes heatIn{from{transform:scale(0);opacity:0}}
  .hcell:not(.fut):not(.ph):hover{transform:scale(1.6);box-shadow:0 0 10px var(--acc)}
  .dayhead .d.on{animation:todayPulse 2s ease-in-out infinite}
  @keyframes todayPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
  .task .tick{transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
  .task .tick:hover{transform:scale(1.2) rotate(-6deg)}
  .spark{position:fixed;z-index:98;pointer-events:none;animation:sparkFly .7s ease-out forwards}
  @keyframes sparkFly{to{transform:translate(var(--sx,0),var(--sy,0)) scale(0) rotate(540deg);opacity:0}}
  .confetti{position:fixed;top:-18px;z-index:97;pointer-events:none;animation:confFall linear forwards}
  @keyframes confFall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--sw,0),106vh) rotate(720deg);opacity:.9}}
  .trail{position:fixed;z-index:96;width:5px;height:5px;border-radius:50%;background:var(--accSoft);box-shadow:0 0 7px var(--accSoft);pointer-events:none;transform:translate(-50%,-50%);animation:trailFx .8s ease-out forwards}
  @keyframes trailFx{to{transform:translateY(30px) scale(0);opacity:0}}
  .shake{animation:shakeX .45s}
  @keyframes shakeX{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-.3deg)}40%{transform:translateX(6px) rotate(.2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .toast{transform:translateX(-50%) translateY(26px) scale(.92);transition:opacity .3s,transform .5s cubic-bezier(.2,1.8,.35,1)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .modal.open{display:flex;animation:fadeIn .25s}
  .modal.open .inner{animation:zoomIn .4s cubic-bezier(.2,1.5,.3,1)}
  @keyframes zoomIn{from{opacity:0;transform:scale(.82) translateY(34px)}}
  .barfill{transition:width .9s cubic-bezier(.2,.8,.2,1)}
  .chartarea{animation:fadeIn .9s .35s both}
  @keyframes ringPulse{0%,100%{filter:drop-shadow(0 0 6px var(--acc))}50%{filter:drop-shadow(0 0 18px var(--acc))}}
  .dots button{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  .dots button:hover{transform:scale(1.3) rotate(12deg)}
  html.no-fx .fxaurora,html.no-fx #fxStars,html.no-fx .spark,html.no-fx .confetti,html.no-fx .trail,html.no-fx .hero::after{display:none}
  html.no-fx header.top,html.no-fx .hero,html.no-fx nav.tabs,html.no-fx .panel,html.no-fx .hrow,html.no-fx .task,html.no-fx .dlrow,html.no-fx .note,html.no-fx .hcell,html.no-fx .chk.today,html.no-fx .dayhead .d.on{animation:none}
  @media (prefers-reduced-motion:reduce){.fxaurora,#fxStars,.trail,.spark,.confetti{display:none}}
</style>
</head>
<body>
<div class="fxaurora"><div class="blob"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div id="fxStars"></div>
<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="inner panel" id="modalInner" style="padding:20px"></div></div>
<script>
/* ============ Sauvegarde du HTML original (pour l'export ZIP) ============ */
var PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

/* ============ Helpers dates ============ */
var pad = function(n){ return String(n).padStart(2,"0"); };
var dstr = function(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
var todayStr = function(){ return dstr(new Date()); };
var addDays = function(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; };
var uid = function(){ return Math.random().toString(36).slice(2,10); };
var FR_D = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var FR_DS = ["D","L","M","M","J","V","S"];
var FR_M = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
var FR_MS = ["jan","fév","mar","avr","mai","juin","juil","aoû","sep","oct","nov","déc"];
var cap = function(s){ return s.charAt(0).toUpperCase()+s.slice(1); };

/* ============ Données (persistantes, reliées à la vraie date) ============ */
var KEY = "lifeos-v1";
function defaultData(){
  var checks = {};
  var patterns = [function(i){return i%4!==1;}, function(i){return i%3!==0;}, function(i){return i%5!==2;}, function(i){return i%2===0;}];
  ["h1","h2","h3","h4"].forEach(function(hid,hi){
    checks[hid] = {};
    for(var i=1;i<=20;i++){
      if(patterns[hi](i)){ var d=new Date(); d.setDate(d.getDate()-i); checks[hid][dstr(d)] = true; }
    }
  });
  return {
    habits:[
      {id:"h1",name:"Réviser 1h",emoji:"📚",target:6},
      {id:"h2",name:"Sport",emoji:"🏋️",target:4},
      {id:"h3",name:"Lire 10 pages",emoji:"📖",target:7},
      {id:"h4",name:"Coucher avant 00h",emoji:"🌙",target:7}
    ],
    checks:checks,
    tasks:[
      {id:"t1",text:"Finir le DM de maths",done:false},
      {id:"t2",text:"Relire le cours d'histoire",done:true}
    ],
    deadlines:[
      {id:"d1",title:"DM de maths à rendre",date:dstr(addDays(new Date(),3))},
      {id:"d2",title:"Contrôle de physique",date:dstr(addDays(new Date(),9))}
    ],
    notes:[{id:"n1",text:"Bienvenue dans LifeOS. Tes données restent sur ton appareil, sauvegardées automatiquement. Chaque case est reliée à sa vraie date.",createdAt:todayStr()}],
    focus:{},
    difficulties:"",
    images:{logo:null,banniere:null,fond:null,sablier:null,trophee:null,focus:null},
    settings:{mode:"nuit",accent:"bleu",gridScale:"semaine",chartScale:"30j",fx:true}
  };
}
function loadData(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var d = JSON.parse(raw); var def = defaultData(); for(var k in def){ if(d[k]===undefined) d[k]=def[k]; } if(!d.images) d.images = def.images; if(!d.settings.gridScale) d.settings.gridScale = "semaine"; if(!d.settings.chartScale) d.settings.chartScale = "30j"; if(d.settings.fx===undefined) d.settings.fx = true; return d; }
  }catch(e){}
  return defaultData();
}
var S = loadData();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Stockage local saturé : les images importées prennent trop de place"); } }

/* ============ Etat UI ============ */
var TAB = "aujourdhui";
var MONTH_OFFSET = 0;   /* vue Mois : décalage par rapport au mois courant */
var HEAT_YEAR = (new Date()).getFullYear(); /* vue Année */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); },2200);
}

/* Actualisation auto : au changement de vrai jour, tout se recalcule */
var LAST_DAY = todayStr();
setInterval(function(){
  if(todayStr() !== LAST_DAY){
    LAST_DAY = todayStr();
    MONTH_OFFSET = 0; HEAT_YEAR = (new Date()).getFullYear();
    render();
    toast("Nouveau jour : grilles et stats à jour");
  }
}, 30000);

/* ============ Pomodoro ============ */
var pMode = "focus", pDur = 25*60, pLeft = 25*60, pRunning = false;
setInterval(function(){
  if(!pRunning) return;
  if(pLeft > 1){ pLeft--; }
  else{
    pRunning = false;
    if(pMode === "focus"){
      var td = todayStr();
      S.focus[td] = (S.focus[td]||0)+1; save();
      pMode = "pause"; pDur = 5*60; pLeft = 5*60;
      toast("Session de focus terminée. Pause 5 min !");
    }else{
      pMode = "focus"; pDur = 25*60; pLeft = 25*60;
      toast("Pause terminée. Prêt pour une nouvelle session ?");
    }
    render();
    return;
  }
  updateTimerUI();
},1000);
function updateTimerUI(){
  document.querySelectorAll("[data-ptime]").forEach(function(el){ el.textContent = pad(Math.floor(pLeft/60))+":"+pad(pLeft%60); });
  var ring = document.getElementById("pRing");
  if(ring){ var C = 2*Math.PI*88; ring.setAttribute("stroke-dashoffset", String(C*(pLeft/pDur))); }
}

/* ============ Calculs ============ */
function streakOf(hid){
  var hc = S.checks[hid]; if(!hc) return 0;
  var d = new Date();
  if(!hc[dstr(d)]) d.setDate(d.getDate()-1);
  var n = 0;
  while(hc[dstr(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function weekDates(){
  var now = new Date();
  var monday = addDays(now, -((now.getDay()+6)%7));
  var out = [];
  for(var i=0;i<7;i++) out.push(dstr(addDays(monday,i)));
  return out;
}
function recordedDays(){
  /* nombre de vrais jours avec au moins une case cochée */
  var seen = {};
  S.habits.forEach(function(h){
    var hc = S.checks[h] || {};
    Object.keys(hc).forEach(function(k){ if(hc[k]) seen[k] = true; });
  });
  return Object.keys(seen).length;
}
function vis(slot, fallbackSvg, style){
  if(S.images && S.images[slot]) return '<img src="'+S.images[slot]+'" alt="" style="'+(style||"")+'">';
  return fallbackSvg;
}

var app = document.getElementById("app");
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function renderHeader(){
  var now = new Date();
  var dots = "";
  Object.keys(ACCENTS).forEach(function(k){
    var on = S.settings.accent===k ? " on" : "";
    dots += '<button data-act="accent" data-k="'+k+'" class="'+on.trim()+'" title="'+ACCENTS[k].label+'" style="background:linear-gradient(135deg,'+ACCENTS[k].soft+','+ACCENTS[k].main+')"></button>';
  });
  return '<header class="top">'
    + '<div class="brand">'
    + '<div class="logo glow pulse">'+vis("logo", SVG_LOGO)+'</div>'
    + '<div><h1>LIFE<span>OS</span></h1><p><span class="livedot"></span> '+cap(longDate(now))+' · '+recordedDays()+' jours enregistrés</p></div>'
    + '</div>'
    + '<div class="toolbar">'
    + '<div class="seg">'
    + '<button data-act="mode" data-k="nuit" class="'+(S.settings.mode==="nuit"?"on":"")+'">☾ Nuit</button>'
    + '<button data-act="mode" data-k="blanc" class="'+(S.settings.mode==="blanc"?"on":"")+'">☀ Blanc</button>'
    + '</div>'
    + '<div class="dots">'+dots+'</div>'
    + '<button class="btn '+(S.settings.fx===false?"btn-ghost":"btn-soft")+'" data-act="fx" title="Animations ON/OFF">✨ FX</button>'
    + '<button class="btn btn-ghost" data-act="data">💾 Données</button>'
    + '<button class="btn btn-ghost" data-act="visuals">🎨 Visuels</button>'
    + '<button class="btn btn-acc" data-act="zip">⬇ ZIP</button>'
    + '</div></header>';
}
function renderNav(){
  var tabs = [["aujourdhui","◉","Aujourd'hui"],["stats","▲","Stats"],["deadlines","⏳","Deadlines"],["notes","✎","Notes"],["focus","◍","Focus"],["rapport","✉","Rapport Maman"]];
  var html = '<nav class="tabs">';
  tabs.forEach(function(t,i){
    html += '<button data-act="tab" data-k="'+t[0]+'" class="'+(TAB===t[0]?"on":"")+'"><span class="num mono">'+pad(i+1)+'</span><span>'+t[1]+'</span>'+t[2]+'</button>';
  });
  return html+'</nav>';
}

/* ---- Grille d'habitudes, 3 échelles ---- */
function scaleSeg(){
  var opts = [["semaine","7 jours"],["mois","Mois"],["annee","Année"]];
  var h = '<div class="seg mini" style="display:inline-flex">';
  opts.forEach(function(o){
    h += '<button data-act="gscale" data-k="'+o[0]+'" class="'+(S.settings.gridScale===o[0]?"on":"")+'">'+o[1]+'</button>';
  });
  return h+'</div>';
}

function gridSemaine(){
  var days = []; for(var i=6;i>=0;i--) days.push(addDays(new Date(),-i));
  var td = todayStr();
  var head = '<div class="dayhead"><div></div>';
  days.forEach(function(d){ var on = dstr(d)===td ? " on" : ""; head += '<div class="d'+on+'"><div>'+FR_DS[d.getDay()]+'</div><div>'+d.getDate()+'</div></div>'; });
  head += '</div>';
  var rows = "";
  S.habits.forEach(function(h){
    rows += habitRow(h, days, function(d){ return 30; }, "hrow");
  });
  return head + rows;
}

function gridMois(){
  var base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+MONTH_OFFSET);
  var y = base.getFullYear(), m = base.getMonth();
  var dim = daysInMonth(y,m);
  var td = todayStr();
  var days = [];
  for(var i=1;i<=dim;i++) days.push(new Date(y,m,i));
  var isCur = (MONTH_OFFSET===0);
  var head = '<div class="dayhead m"><div style="text-align:left"><div class="navbtns">'
    + '<button class="btn btn-ghost mono" data-act="mnav" data-k="-1" style="padding:3px 9px">‹</button>'
    + '<span class="lbl">'+cap(FR_M[m])+' '+y+'</span>'
    + '<button class="btn btn-ghost mono" data-act="mnav" data-k="1" style="padding:3px 9px">›</button>'
    + (isCur?"":' <button class="btn btn-soft" data-act="mnav" data-k="0" style="padding:3px 9px;font-size:10px">Aujourd\'hui</button>')
    + '</div></div>';
  days.forEach(function(d){ var on = dstr(d)===td ? " on" : ""; head += '<div class="d'+on+'">'+d.getDate()+'</div>'; });
  head += '</div>';
  var rows = "";
  S.habits.forEach(function(h){ rows += habitRow(h, days, function(d){ return 20; }, "hrow m"); });
  return '<div class="gridscroll">' + head + rows + '</div>';
}

function gridAnnee(){
  var y = HEAT_YEAR;
  var td = todayStr();
  var tdDate = new Date(td+"T12:00:00");
  var isCur = (y === (new Date()).getFullYear());
  var head = '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">'
    + '<div class="navbtns">'
    + '<button class="btn btn-ghost mono" data-act="ynav" data-k="-1" style="padding:3px 9px">‹</button>'
    + '<span class="lbl">'+y+'</span>'
    + '<button class="btn btn-ghost mono" data-act="ynav" data-k="1" style="padding:3px 9px">›</button>'
    + (isCur?"":' <button class="btn btn-soft" data-act="ynav" data-k="0" style="padding:3px 9px;font-size:10px">Aujourd\'hui</button>')
    + '</div>'
    + '<span class="mono" style="font-size:10px;color:var(--text2)">clique une case pour cocher/annuler ce jour-là</span></div>';

  var html = '<div class="gridscroll">' + head;
  S.habits.forEach(function(h){
    var hc = S.checks[h.id] || {};
    var start = new Date(y,0,1);
    var startDow = (start.getDay()+6)%7; /* lundi = 0 */
    var end = new Date(y,11,31);
    var cols = [];
    var d = new Date(start);
    var n = 0;
    while(d <= end){
      var dow = (d.getDay()+6)%7;
      var col = Math.floor((n + startDow)/7);
      if(!cols[col]) cols[col] = [null,null,null,null,null,null,null];
      var s = dstr(d);
      var fut = (y === (new Date()).getFullYear() && d > tdDate);
      cols[col][dow] = { d:s, on:!!hc[s], fut:fut };
      d.setDate(d.getDate()+1);
      n++;
    }
    var heat = '<div class="heat">';
    cols.forEach(function(colArr,ci){
      heat += '<div class="hcol">';
      for(var r=0;r<7;r++){
        var c = colArr[r];
        if(c === null){ heat += '<div class="hcell ph" style="--c:'+ci+'"></div>'; }
        else if(c.fut){ heat += '<div class="hcell fut" style="--c:'+ci+'"></div>'; }
        else{
          var cls = "hcell" + (c.on ? " on" : " miss");
          heat += '<div class="'+cls+'" style="--c:'+ci+'" data-act="check" data-h="'+h.id+'" data-d="'+c.d+'" title="'+longDate(new Date(c.d+"T12:00:00"))+'"></div>';
        }
      }
      heat += '</div>';
    });
    heat += '</div>';
    html += '<div style="display:grid;grid-template-columns:minmax(110px,1fr) 1fr;gap:10px;align-items:start;margin-bottom:12px">'
      + '<div class="hname"><span class="nm">'+h.emoji+' '+esc(h.name)+'</span><span class="hmeta"><span class="st">'+streakOf(h.id)+' j</span></span></div>'
      + heat + '</div>';
  });
  html += '<div class="legend"><span><span class="sq on"></span>coché</span><span><span class="sq miss"></span>manqué</span><span><span class="sq" style="opacity:.2"></span>à venir</span></div>';
  html += '</div>';
  return html;
}

}

function chartSeries(){
  var pts = [];
  if(S.settings.chartScale==="7j" || S.settings.chartScale==="30j"){
    var n = S.settings.chartScale==="7j" ? 7 : 30;
    for(var i=n-1;i>=0;i--){
      var d = addDays(new Date(),-i); var s = dstr(d);
      var dn = S.habits.filter(function(h){ return S.checks[h.id]&&S.checks[h.id][s]; }).length;
      pts.push({label:(d.getDate()+"/"+(d.getMonth()+1)), taux: S.habits.length?Math.round(dn/S.habits.length*100):0});
    }
  }else{
    for(var i=11;i>=0;i--){
      var ref = new Date(); ref.setDate(1); ref.setMonth(ref.getMonth()-i);
      var y = ref.getFullYear(), m = ref.getMonth();
      var dim = daysInMonth(y,m);
      var sum = 0, cnt = 0;
      for(var j=1;j<=dim;j++){
        var dd = new Date(y,m,j); var s = dstr(dd);
        if(dd > new Date()) break;
        var dn = S.habits.filter(function(h){ return S.checks[h.id]&&S.checks[h.id][s]; }).length;
        sum += S.habits.length?dn/S.habits.length:0; cnt++;
      }
      var lbl = (i===0) ? FR_MS[m] : FR_MS[m]+" "+String(y).slice(2);
      pts.push({label:lbl, taux: cnt?Math.round(sum/cnt*100):0});
    }
  }
  return pts;
}

function renderStats(){
  var td = todayStr();
  var doneToday = S.habits.filter(function(h){ return S.checks[h.id] && S.checks[h.id][td]; }).length;
  var todayPct = S.habits.length ? Math.round(doneToday/S.habits.length*100) : 0;
  var best = 0; S.habits.forEach(function(h){ best = Math.max(best, streakOf(h.id)); });
  var wk = weekDates();
  var wDone = 0, wTarget = 0;
  S.habits.forEach(function(h){ wTarget += h.target; wk.forEach(function(s){ if(S.checks[h.id]&&S.checks[h.id][s]) wDone++; }); });
  var wPct = wTarget ? Math.round(wDone/wTarget*100) : 0;

  var kpis = [
    ["Taux du jour",todayPct+"%",doneToday+"/"+S.habits.length+" habitudes"],
    ["Meilleure série",best+" j",best>=7?"🔥 En feu":"Continue !"],
    ["Cette semaine",wPct+"%",wDone+"/"+wTarget+" cases"],
    ["Jours enregistrés",String(recordedDays()),"tout l'historique conservé"]
  ];
  var kh = '<div class="kpis">';
  kpis.forEach(function(k){ kh += '<div class="panel kpi"><div class="lb">'+k[0]+'</div><div class="vl">'+k[1]+'</div><div class="sb">'+k[2]+'</div></div>'; });
  kh += '</div>';

  var pts = chartSeries();
  var W=560,H=200,padL=8,padB=20, maxDays = pts.length;
  var x = function(i){ return padL + i*((W-2*padL)/(maxDays-1)); };
  var y = function(v){ return 8 + (100-v)/100*(H-36); };
  var line = pts.map(function(p,i){ return x(i)+","+y(p.taux); }).join(" ");
  var area = "M"+padL+","+(H-padB)+" L"+pts.map(function(p,i){ return x(i)+","+y(p.taux); }).join(" L")+" L"+x(maxDays-1)+","+(H-padB)+" Z";
  var skip = maxDays>15 ? 3 : 1;
  var labels = pts.map(function(p,i){ return (i%skip===0)?'<text x="'+x(i)+'" y="'+(H-6)+'" font-size="9" fill="var(--text2)" text-anchor="middle" font-family="monospace">'+p.label+'</text>':''; }).join("");

  var bars = "";
  S.habits.forEach(function(h,i){
    var n = wk.filter(function(s){ return S.checks[h.id]&&S.checks[h.id][s]; }).length;
    var wpct = Math.min(100, Math.round(n/h.target*100));
    bars += '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span>'+h.emoji+' '+esc(h.name)+'</span><span class="mono" style="color:var(--text2)">'+n+'/'+h.target+'</span></div>'
      + '<div style="height:8px;background:var(--grid);border-radius:99px;overflow:hidden"><div class="barfill" data-w="'+wpct+'" style="height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--accSoft));box-shadow:0 0 8px color-mix(in srgb,var(--acc) 50%, transparent)"></div></div></div>';
  });

  var cOpts = [["7j","7 jours"],["30j","30 jours"],["an","12 mois"]];
  var cSeg = '<div class="seg mini" style="display:inline-flex">';
  cOpts.forEach(function(o){ cSeg += '<button data-act="cscale" data-k="'+o[0]+'" class="'+(S.settings.chartScale===o[0]?"on":"")+'">'+o[1]+'</button>'; });
  cSeg += '</div>';

  return kh
    + '<div class="grid2b grid2" style="margin-top:18px">'
    + '<div class="panel card"><div class="cardhead"><h2>Taux de complétion</h2>'+cSeg+'</div>'
    + '<div class="sub" style="margin-top:0">Pourcentage d\'habitudes cochées · '+ (S.settings.chartScale==="an" ? "moyenne mensuelle" : "jour par jour") +'</div>'
    + '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:220px">'
    + '<defs><linearGradient id="gradA" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--acc)" stop-opacity="0.45"/><stop offset="100%" stop-color="var(--acc)" stop-opacity="0.02"/></linearGradient></defs>'
    + '<g stroke="var(--grid)" stroke-dasharray="3 3"><line x1="0" y1="'+y(100)+'" x2="'+W+'" y2="'+y(100)+'"/><line x1="0" y1="'+y(50)+'" x2="'+W+'" y2="'+y(50)+'"/><line x1="0" y1="'+y(0)+'" x2="'+W+'" y2="'+y(0)+'"/></g>'
    + '<path class="chartarea" d="'+area+'" fill="url(#gradA)"/>'
    + '<polyline id="chartLine" points="'+line+'" fill="none" stroke="var(--acc)" stroke-width="2.5" style="filter:drop-shadow(0 0 5px var(--acc))"/>'
    + '<circle cx="'+x(maxDays-1)+'" cy="'+y(pts[maxDays-1].taux)+'" r="4" fill="var(--accSoft)" style="filter:drop-shadow(0 0 6px var(--accSoft))"><animate attributeName="r" values="3.5;6;3.5" dur="1.6s" repeatCount="indefinite"/></circle>'
    + labels+'</svg></div>'
    + '<div class="panel card"><h2>Objectifs de la semaine</h2><div class="sub">Cases cochées sur 7 jours vs objectif</div>'+bars+'</div>'
    + '</div>'
    + '<div class="panel card" style="margin-top:18px"><div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap">'
    + '<div style="flex-shrink:0">'+vis("trophee", SVG_TROPHEE)+'</div>'
    + '<div style="flex:1;min-width:240px"><h2>Revue de semaine</h2>'
    + '<div style="font-size:12px;color:var(--text2);line-height:1.7;margin-top:8px" id="revueTxt">Chargement...</div></div>'
    + '</div></div>';
}

function renderRapport(){
  var td = todayStr();
  var checked = S.habits.filter(function(h){ return S.checks[h.id]&&S.checks[h.id][td]; });
  var missed = S.habits.filter(function(h){ return !(S.checks[h.id]&&S.checks[h.id][td]); });
  var doneT = S.tasks.filter(function(t){ return t.done; });
  var pend = S.tasks.filter(function(t){ return !t.done; });
  var sessions = S.focus[td]||0;

  var L = [];
  L.push("Objet : Rapport de ma journée : "+longDate(new Date()));
  L.push(""); L.push("Bonjour Maman,"); L.push("");
  L.push("Voici le résumé de ma journée de travail."); L.push("");
  L.push("TÂCHES RÉALISÉES :");
  if(!doneT.length && !checked.length){ L.push("- Rien de coché pour l'instant aujourd'hui."); }
  else{
    doneT.forEach(function(t){ L.push("- "+t.text); });
    if(doneT.length && checked.length) L.push("");
    if(checked.length){ L.push("HABITUDES DU JOUR :"); checked.forEach(function(h){ L.push("- "+h.name+" : fait"); }); }
  }
  L.push("");
  L.push("FOCUS : "+sessions+" session"+(sessions>1?"s":"")+" de travail concentré ("+sessions*25+" min).");
  L.push(""); L.push("CE QU'IL ME RESTE :");
  if(!pend.length && !missed.length){ L.push("- Tout est bouclé pour aujourd'hui."); }
  else{
    pend.forEach(function(t){ L.push("- "+t.text); });
    missed.forEach(function(h){ L.push("- "+h.name+" (pas encore fait)"); });
  }
  L.push(""); L.push("DIFFICULTÉS RENCONTRÉES :");
  L.push(S.difficulties.trim() ? S.difficulties.trim() : "- Rien de particulier à signaler.");
  L.push(""); L.push("Bonne soirée,"); L.push("Paul");
  var report = L.join("\n");

  return '<div class="grid2b grid2">'
    + '<div class="panel card"><h2>Difficultés rencontrées</h2><div class="sub">Ce champ alimente directement le rapport</div>'
    + '<textarea class="fld" id="diffText" placeholder="Ex. difficile de me concentrer en fin de journée, le chapitre de physique était costaud..." style="width:100%;min-height:130px;resize:vertical">'+esc(S.difficulties)+'</textarea>'

    + '<div class="kpi" style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px"><div class="vl" style="font-size:18px">'+checked.length+'/'+S.habits.length+'</div><div class="sb">habitudes</div></div>'
    + '<div class="kpi" style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px"><div class="vl" style="font-size:18px">'+doneT.length+'/'+S.tasks.length+'</div><div class="sb">tâches</div></div>'
    + '<div class="kpi" style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px"><div class="vl" style="font-size:18px">'+sessions+'</div><div class="sb">sessions</div></div>'
    + '</div></div>'
    + '<div class="panel card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Rapport pré-rempli</h2><span class="mono" style="font-size:10px;color:var(--text2)">auto-généré</span></div>'
    + '<div class="sub">Généré à partir de tes cases cochées aujourd\'hui</div>'

function fillRevue(){
  var el = document.getElementById("revueTxt");
  if(!el) return;
  var wk = weekDates();
  var wDone = 0, wTarget = 0;
  S.habits.forEach(function(h){ wTarget += h.target; wk.forEach(function(s){ if(S.checks[h.id]&&S.checks[h.id][s]) wDone++; }); });
  var wPct = wTarget ? Math.round(wDone/wTarget*100) : 0;
  var bestH = {name:"-",n:0}, worstH = {name:"-",n:99};
  S.habits.forEach(function(h){
    var n = wk.filter(function(s){ return S.checks[h.id]&&S.checks[h.id][s]; }).length;
    if(n>bestH.n) bestH = {name:h.emoji+" "+h.name,n:n};
    if(n<worstH.n) worstH = {name:h.emoji+" "+h.name,n:n};
  });

  el.innerHTML = '📊 <b style="color:var(--text)">Bilan global :</b> '+wPct+'% ('+wDone+' cases sur '+wTarget+' prévues).<br/>'
    + '🏆 <b style="color:var(--text)">Point fort :</b> '+esc(bestH.name)+' avec '+bestH.n+' réalisations.<br/>'

/* ============ ZIP ============ */
var CRC_TABLE = null;
function crc32(bytes){
  if(!CRC_TABLE){
    CRC_TABLE = [];
    for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); CRC_TABLE[n] = c>>>0; }
  }
  var crc = 0xFFFFFFFF;
  for(var i=0;i<bytes.length;i++) crc = (crc>>>8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF)>>>0;
}
function makeZip(files){
  var enc = new TextEncoder();
  var now = new Date();
  var dTime = (now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);
  var dDate = (((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate()) & 0xFFFF;
  var parts = [], central = [], offset = 0;
  files.forEach(function(f){
    var nb = enc.encode(f.name);
    var data = (typeof f.data === "string") ? enc.encode(f.data) : f.data;
    var crc = crc32(data);
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dTime,true); lh.setUint16(12,dDate,true); lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nb, data);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dTime,true); ch.setUint16(14,dDate,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,nb.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), nb);
    offset += 30 + nb.length + data.length;
  });
  var cdSize = central.reduce(function(s,p){ return s+p.length; },0);
  var eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true); eocd.setUint16(4,0,true); eocd.setUint16(6,0,true);
  eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true); eocd.setUint32(16,offset,true); eocd.setUint16(20,0,true);
  var all = parts.concat(central); all.push(new Uint8Array(eocd.buffer));
  return new Blob(all, {type:"application/zip"});
}
function dataUrlToBytes(url){
  var comma = url.indexOf(",");
  var b64 = url.slice(comma+1);
  var bin = atob(b64);
  var out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* ============ FX : moteur d'animations ============ */
function applyFx(){
  if(S.settings.fx===false) document.documentElement.classList.add("no-fx");
  else document.documentElement.classList.remove("no-fx");
}
(function initFxLayers(){
  var host = document.getElementById("fxStars");
  if(!host) return;

    var st = document.createElement("div");
    st.className = "star";

    st.style.cssText = "left:"+(Math.random()*100).toFixed(2)+"vw;top:"+(Math.random()*130).toFixed(0)+"vh;width:"+sz+"px;height:"+sz+"px;animation-duration:"+(9+Math.random()*15).toFixed(1)+"s;animation-delay:-"+(Math.random()*22).toFixed(1)+"s";
    host.appendChild(st);
  }
})();
function burst(x,y,n,colors){
  if(S.settings.fx===false) return;
  var cols = colors || ["var(--accSoft)","#EBD27A","#FFFFFF","var(--acc)"];
  for(var i=0;i<(n||14);i++){
    var p = document.createElement("div");
    var a = Math.random()*Math.PI*2, dist = 28+Math.random()*70;
    p.className = "spark";
    p.style.cssText = "left:"+x+"px;top:"+y+"px;background:"+cols[i%cols.length]+";width:"+(4+Math.random()*6).toFixed(0)+"px;height:"+(4+Math.random()*6).toFixed(0)+"px;border-radius:"+(Math.random()>.5?"50%":"2px")+";--sx:"+(Math.cos(a)*dist).toFixed(0)+"px;--sy:"+(Math.sin(a)*dist).toFixed(0)+"px;animation-duration:"+(0.45+Math.random()*0.5).toFixed(2)+"s";
    document.body.appendChild(p);
    (function(q){ setTimeout(function(){ q.remove(); },1100); })(p);
  }
}
function confetti(){
  if(S.settings.fx===false) return;
  var cols = ["#3B82F6","#7DA9F8","#EBD27A","#D4AF37","#22D3EE","#F472B6","#FFFFFF"];
  var W = window.innerWidth;
  for(var i=0;i<130;i++){
    var c = document.createElement("div");
    c.className = "confetti";
    c.style.cssText = "left:"+(Math.random()*W).toFixed(0)+"px;background:"+cols[i%cols.length]+";width:"+(6+Math.random()*6).toFixed(0)+"px;height:"+(10+Math.random()*9).toFixed(0)+"px;border-radius:"+(Math.random()>.5?"2px":"50%")+";animation-duration:"+(2.4+Math.random()*2.4).toFixed(2)+"s;animation-delay:"+(Math.random()*0.6).toFixed(2)+"s;--sw:"+(Math.random()*240-120).toFixed(0)+"px";
    document.body.appendChild(c);
    (function(q){ setTimeout(function(){ q.remove(); },5600); })(c);
  }
}
function fxShake(){
  if(S.settings.fx===false) return;
  var a = document.getElementById("app");
  a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
}
function fxPop(h,d){
  var t = app.querySelector('[data-h="'+h+'"][data-d="'+d+'"]');
  if(!t) return;
  t.classList.add("fx-pop");
  if(t.classList.contains("hcell")) return;
  (function(q){ setTimeout(function(){ q.classList.remove("fx-pop"); },650); })(t);
}
function fxStagger(){
  [".hrow",".task",".dlrow",".note"].forEach(function(sel){
    app.querySelectorAll(sel).forEach(function(el,i){ el.style.setProperty("--d",i); });
  });
}
function fxCount(){
  if(S.settings.fx===false) return;
  app.querySelectorAll(".vl").forEach(function(el){
    var m = String(el.textContent).match(/^(\d+)(\D*)$/);
    if(!m || Number(m[1])===0) return;
    var target = Number(m[1]), rest = m[2], t0 = null;
    function step(ts){
      if(t0===null) t0 = ts;
      var p = Math.min(1,(ts-t0)/800), e = 1-Math.pow(1-p,3);
      el.textContent = Math.round(target*e)+rest;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function fxAfter(){
  requestAnimationFrame(function(){
    app.querySelectorAll(".barfill").forEach(function(b){ b.style.width = b.getAttribute("data-w")+"%"; });
    var ln = document.getElementById("chartLine");
    if(ln){
      try{
        var len = ln.getTotalLength();
        ln.style.transition = "none";
        ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
        ln.getBoundingClientRect();
        ln.style.transition = "stroke-dashoffset 1.2s cubic-bezier(.3,.7,.3,1)";
        ln.style.strokeDashoffset = "0";
      }catch(e){}
    }
  });
}
document.addEventListener("pointerdown", function(ev){
  if(S.settings.fx===false) return;
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el || el.disabled) return;
  var r = el.getBoundingClientRect(), d = Math.max(r.width, r.height);
  var sp = document.createElement("span");
  sp.className = "ripple";
  sp.style.width = sp.style.height = d+"px";
  sp.style.left = (ev.clientX - r.left - d/2)+"px";
  sp.style.top = (ev.clientY - r.top - d/2)+"px";
  el.appendChild(sp);
  setTimeout(function(){ sp.remove(); },600);
});
var lastTrail = 0;
document.addEventListener("pointermove", function(ev){
  if(S.settings.fx===false) return;
  var now = Date.now();
  if(now - lastTrail < 70) return;
  lastTrail = now;
  var t = document.createElement("div");
  t.className = "trail";
  t.style.left = ev.clientX+"px"; t.style.top = ev.clientY+"px";
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },850);
});

document.addEventListener("click", function(ev){

  var act = el.getAttribute("data-act"), k = el.getAttribute("data-k");
  if(act==="tab"){ TAB = k; render(); }
  else if(act==="mode"){ S.settings.mode = k; save(); render(); }
  else if(act==="accent"){ S.settings.accent = k; save(); render(); }
  else if(act==="goFocus"){ TAB = "focus"; render(); }
  else if(act==="gscale"){ S.settings.gridScale = k; save(); render(); }
  else if(act==="cscale"){ S.settings.chartScale = k; save(); render(); }
  else if(act==="fx"){ S.settings.fx = (S.settings.fx===false); save(); render(); toast(S.settings.fx?"🎆 Mode pyrotechnique":"Mode zen"); }
  else if(act==="mnav"){
    if(k==="0"){ MONTH_OFFSET = 0; } else { MONTH_OFFSET += Number(k); }
    var lim = new Date(); lim.setDate(1);
    var cur = new Date(); cur.setDate(1); cur.setMonth(cur.getMonth()+MONTH_OFFSET);
    if(cur > lim) MONTH_OFFSET = 0;
    render();
  }
  else if(act==="ynav"){
    if(k==="0"){ HEAT_YEAR = (new Date()).getFullYear(); }
    else{
      HEAT_YEAR += Number(k);
      var cy = (new Date()).getFullYear();
      if(HEAT_YEAR > cy) HEAT_YEAR = cy;
    }
    render();
  }
  else if(act==="check"){
    var h = el.getAttribute("data-h"), d = el.getAttribute("data-d");
    if(d > todayStr()){ toast("Ce jour n'est pas encore arrivé"); return; }
    if(!S.checks[h]) S.checks[h] = {};
    var will = !S.checks[h][d];
    S.checks[h][d] = will;
    save();
    var rc = el.getBoundingClientRect();
    burst(rc.left+rc.width/2, rc.top+rc.height/2, will?22:9);
    if(will) fxShake();
    render();
    fxPop(h,d);
    if(will && d===todayStr()){
      var doneN = S.habits.filter(function(hb){ return S.checks[hb.id] && S.checks[hb.id][d]; }).length;
      if(S.habits.length && doneN===S.habits.length){ confetti(); toast("🎉 Journée parfaite, tout est coché !"); }
    }
  }
  else if(act==="addHabit"){
    var nm = document.getElementById("hName"), em = document.getElementById("hEmoji"), tg = document.getElementById("hTarget");
    if(!nm.value.trim()) return;
    var id = uid();
    S.habits.push({id:id,name:nm.value.trim(),emoji:em.value||"✨",target:Number(tg.value)});
    S.checks[id] = {};
    nm.value = ""; em.value = "✨"; save(); render(); toast("Habitude ajoutee");
  }
  else if(act==="delHabit"){
    S.habits = S.habits.filter(function(h){ return h.id!==k; });
    delete S.checks[k]; save(); render();
  }
  else if(act==="toggleTask"){
    var willDo = false;
    S.tasks.forEach(function(t){ if(t.id===k) willDo = !t.done; });
    S.tasks.forEach(function(t){ if(t.id===k) t.done = willDo; });
    save();
    if(willDo){ var tr = el.getBoundingClientRect(); burst(tr.left+tr.width/2, tr.top+tr.height/2, 14); fxShake(); }
    render();
    var tb = app.querySelector('[data-act="toggleTask"][data-k="'+k+'"]');
    if(tb){ tb.classList.add("fx-pop"); (function(q){ setTimeout(function(){ q.classList.remove("fx-pop"); },650); })(tb); }
    if(willDo && S.tasks.length && S.tasks.every(function(t){ return t.done; })){ confetti(); toast("🎉 Toutes les tâches sont terminées !"); }
  }
  else if(act==="addTask"){
    var inp = document.getElementById("taskName");
    if(!inp.value.trim()) return;
    S.tasks.push({id:uid(),text:inp.value.trim(),done:false});
    inp.value = ""; save(); render(); toast("Tache ajoutee");
  }
  else if(act==="delTask"){ S.tasks = S.tasks.filter(function(t){ return t.id!==k; }); save(); render(); }
  else if(act==="addDl"){
    var ti = document.getElementById("dlTitle"), da = document.getElementById("dlDate");
    if(!ti.value.trim()||!da.value) return;
    S.deadlines.push({id:uid(),title:ti.value.trim(),date:da.value});
    ti.value=""; da.value=""; save(); render(); toast("Deadline ajoutee");
  }
  else if(act==="delDl"){ S.deadlines = S.deadlines.filter(function(d){ return d.id!==k; }); save(); render(); }
  else if(act==="addNote"){
    var ta = document.getElementById("noteText");
    if(!ta.value.trim()) return;
    S.notes.unshift({id:uid(),text:ta.value.trim(),createdAt:todayStr()});
    ta.value=""; save(); render(); toast("Note enregistree");
  }
  else if(act==="delNote"){ S.notes = S.notes.filter(function(n){ return n.id!==k; }); save(); render(); }
  else if(act==="pRun"){ pRunning = !pRunning; render(); }
  else if(act==="preset"){ pRunning=false; pMode="focus"; pDur=Number(k)*60; pLeft=pDur; render(); }
  else if(act==="saveDiff"){
    var df = document.getElementById("diffText");
    S.difficulties = df.value; save(); render(); toast("Difficultes enregistrees");
  }
  else if(act==="copyReport"){
    var txt = document.getElementById("reportPre").textContent;
    var done = function(){ toast("Rapport copie dans le presse-papier"); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); }); }
    else fallbackCopy(txt);
  }
  else if(act==="visuals"){ openVisuals(); }
  else if(act==="data"){ openDataModal(); }
  else if(act==="exportData"){ exportData(); }
  else if(act==="closeModal"){ document.getElementById("modal").classList.remove("open"); }
  else if(act==="resetImg"){ S.images[k] = null; save(); openVisuals(); render(); }
  else if(act==="zip"){ exportZip(); }
});
function fallbackCopy(txt){
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Rapport copie"); }
  catch(e){ toast("Copie impossible, selectionne le texte manuellement"); }
  document.body.removeChild(ta);
}
document.getElementById("modal").addEventListener("click", function(ev){
  if(ev.target === this) this.classList.remove("open");
});

/* ============ Start ============ */
render();
</script>
</body>
</html>
